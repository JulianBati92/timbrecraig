<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131a"><meta name="description" content="Timbre digital QR"><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/styles.css"><title>TimbreCraig</title></head><body><div class="ambient ambient-one" aria-hidden="true"></div><div class="ambient ambient-two" aria-hidden="true"></div><main class="shell"><section class="card" id="doorbellCard"><div class="bell-wrap" aria-hidden="true"><div class="bell-halo"></div><div class="bell" id="bellIcon">🔔</div></div><p class="eyebrow">TIMBRE DIGITAL</p><h1>TimbreCraig</h1><p class="lead">¿Estás en la puerta? Tocá el timbre y avisaremos enseguida.</p><button id="quickRing" class="ring" type="button"><span class="ring-icon">🔔</span><span class="ring-label">TOCAR TIMBRE</span><span class="ring-loader" aria-hidden="true"></span></button><p class="privacy"><span class="online-dot" aria-hidden="true"></span> Timbre disponible · No necesitás instalar ninguna aplicación.</p><div class="divider"><span>o dejá tus datos</span></div><form id="visitorForm" autocomplete="on"><label>Nombre <span>opcional</span><input id="name" name="name" maxlength="80" autocomplete="name" placeholder="¿Cómo te llamás?"></label><label>Motivo<select id="reason" name="reason"><option>Visita</option><option>Entrega</option><option>Correo</option><option>Técnico</option><option>Otro</option></select></label><label>Teléfono <span>opcional</span><input id="phone" name="phone" maxlength="40" inputmode="tel" autocomplete="tel" placeholder="Para poder contactarte"></label><label>Mensaje <span>opcional</span><textarea id="message" name="message" maxlength="300" rows="3" placeholder="Ej: Traigo un paquete"></textarea></label><button class="send" type="submit"><span>AVISAR QUE ESTOY ACÁ</span></button></form><div id="status" class="status" role="status" aria-live="polite"></div></section><footer>Tu información sólo se usa para avisar esta visita.</footer></main><div id="toast" class="toast" role="status" aria-live="polite"><div class="toast-icon" id="toastIcon">✓</div><div><strong id="toastTitle">Aviso enviado</strong><p id="toastMessage">Ya avisamos que estás en la puerta.</p></div></div><script src="/app.js" defer></script></body></html>
